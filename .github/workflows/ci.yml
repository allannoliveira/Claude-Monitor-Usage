name: CI

# Roda em todo push e em todo Pull Request para as branches principais.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:   # botão "Run workflow" na aba Actions

jobs:
  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compilar (erros de sintaxe)
        run: python -m compileall -q claude_monitor main.py

      - name: Testes
        run: python -m pytest -q

      - name: CLI responde
        run: python main.py --help

  package:
    name: Pacote (wheel)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
